    purpose: Passing fixture for local-only harness run validation.
    required: false
  - path: fixtures/harness-runs/invalid-missing-field/harness-maker/classification.yaml
    purpose: Failing fixture for validator regression checks.
    required: false
  - path: fixtures/harness-runs/invalid-compound-active/harness-maker/classification.yaml
    purpose: Failing fixture for Compound proposed-only governance checks.
    required: false
  - path: docs/harness/templates/prompts/harness-maker.md
