    required: true
  - path: tools/pre-handoff-gate.ts
    purpose: Pre-handoff gate that requires current validation before readiness claims.
    required: true
  - path: tools/validate-fixtures.ts
    purpose: Regression fixture runner for positive and negative validator fixtures.
    required: true
  - path: tools/build-portable-handoff-bundle.ts
    purpose: Portable handoff bundle builder that copies run artifacts and required workspace files into a transferable directory.
    required: true
  - path: schemas/harness-run/classification.schema.json
    purpose: Machine-readable contract for first-action classification.
    required: true
  - path: schemas/harness-run/deep-interview-summary.schema.json
    purpose: Machine-readable contract for Deep Interview summary artifacts.
    required: true
  - path: schemas/harness-run/pm-debate-summary.schema.json
    purpose: Machine-readable contract for KIMI-active PM debate summaries.
    required: true
  - path: schemas/harness-run/compound-approval-candidates.schema.json
    purpose: Machine-readable contract for Compound Extraction approval candidates.
    required: true
optional_files:
